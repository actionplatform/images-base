name: Publish images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, node, go, java, ruby]
        kind: [build, runtime]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        if: ${{ secrets.DOCKERHUB_TOKEN != '' }}
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: version
        run: |
          v="${GITHUB_REF_NAME#v}"
          echo "full=$v" >> "$GITHUB_OUTPUT"
          echo "major=${v%%.*}" >> "$GITHUB_OUTPUT"
          echo "minor=${v%.*}" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.kind }}-${{ matrix.language }}
            ${{ secrets.DOCKERHUB_TOKEN != '' && format('docker.io/{0}/{1}-{2}', vars.DOCKERHUB_NAMESPACE || 'actionplatformio', matrix.kind, matrix.language) || '' }}
          tags: |
            type=raw,value=${{ steps.version.outputs.full }}
            type=raw,value=${{ steps.version.outputs.minor }}
            type=raw,value=${{ steps.version.outputs.major }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: images/${{ matrix.language }}/${{ matrix.kind == 'build' && 'Dockerfile' || 'runtime.Dockerfile' }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.kind }}-${{ matrix.language }}
          cache-to: type=gha,mode=max,scope=${{ matrix.kind }}-${{ matrix.language }}
