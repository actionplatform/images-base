name: Publish images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.matrix.outputs.include }}
    steps:
      - uses: actions/checkout@v5
      - id: matrix
        run: |
          include=$(jq -c '[to_entries[] as $l | $l.value.versions | to_entries[] as $v
            | ("build", "runtime") as $kind
            | {language: $l.key, version: $v.key, kind: $kind, base: $v.value[$kind],
               default: ($v.key == $l.value.default)}]' versions.json)
          echo "include=$include" >> "$GITHUB_OUTPUT"

  images:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.matrix.outputs.include) }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        run: |
          v="${GITHUB_REF_NAME#v}"
          echo "full=$v" >> "$GITHUB_OUTPUT"
          echo "major=${v%%.*}" >> "$GITHUB_OUTPUT"
          echo "minor=${v%.*}" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.kind }}-${{ matrix.language }}
          tags: |
            type=raw,value=${{ matrix.version }}
            type=raw,value=${{ matrix.version }}-${{ steps.version.outputs.minor }}
            type=raw,value=${{ matrix.version }}-${{ steps.version.outputs.full }}
            type=raw,value=${{ steps.version.outputs.full }},enable=${{ matrix.default }}
            type=raw,value=${{ steps.version.outputs.minor }},enable=${{ matrix.default }}
            type=raw,value=${{ steps.version.outputs.major }},enable=${{ matrix.default }}
            type=raw,value=latest,enable=${{ matrix.default }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: images/${{ matrix.language }}/${{ matrix.kind == 'build' && 'Dockerfile' || 'runtime.Dockerfile' }}
          build-args: |
            BASE=${{ matrix.base }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.kind }}-${{ matrix.language }}-${{ matrix.version }}
          cache-to: type=gha,mode=max,scope=${{ matrix.kind }}-${{ matrix.language }}-${{ matrix.version }}
