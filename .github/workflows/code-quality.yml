name: Code Quality

on:
  pull_request:
  push:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: pytest -q

  versions:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.matrix.outputs.include }}
    steps:
      - uses: actions/checkout@v5
      - id: matrix
        run: |
          include=$(jq -c --argjson t '{"python":"projects/web/python/fastapi","node":"projects/web/node/fastify","go":"projects/web/go/gin","java":"projects/web/java/spring","ruby":"projects/web/ruby/sinatra"}' \
            '[to_entries[] as $l | $l.value.versions | to_entries[] as $v
              | {language: $l.key, version: $v.key, base: $v.value.build, template: $t[$l.key]}]' versions.json)
          echo "include=$include" >> "$GITHUB_OUTPUT"

  templates:
    needs: versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.versions.outputs.include) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: actionplatform/templates
          path: templates
      - uses: actions/checkout@v5
        with:
          repository: actionplatform/apx-aws-lambda
          path: plugin
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: images/${{ matrix.language }}/Dockerfile
          build-args: |
            BASE=${{ matrix.base }}
            VERSION=${{ matrix.version }}
          load: true
          tags: build-${{ matrix.language }}:test
          cache-from: type=gha,scope=build-${{ matrix.language }}-${{ matrix.version }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.language }}-${{ matrix.version }}
      - run: pipx run cookiecutter --no-input -o out templates/${{ matrix.template }} project_name=demo _${{ matrix.language }}_version=${{ matrix.version }}
      - if: matrix.language == 'python'
        run: docker run --rm -v "$PWD/out/demo:/w" --entrypoint poetry build-python:test lock --no-interaction
      - run: pipx run cookiecutter --no-input -o overlay plugin/apx_aws_lambda/overlays/cloud/aws/lambda project_name=demo language=${{ matrix.language }} type=web ci=github && cp -R overlay/demo/. out/demo/
      - run: docker run --rm -v "$PWD/out/demo:/w" build-${{ matrix.language }}:test install build test lint package
      - run: test -s out/demo/.ap-build/package/run.sh || test -s out/demo/.ap-build/package/bootstrap
